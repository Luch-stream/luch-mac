name: macOS

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: libopus
        run: brew install opus
      - name: Format
        run: |
          if ! command -v swift-format >/dev/null; then brew install swift-format; fi
          swift-format lint --strict -r Sources Tests
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
