name: LuchiOS
options:
  bundleIdPrefix: dev.luch
  deploymentTarget:
    iOS: "17.0"
packages:
  Luch:
    path: ..
targets:
  LuchiOS:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: Luch
        product: LuchReceive
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Luch
        CFBundleShortVersionString: "0.1"
        NSLocalNetworkUsageDescription: Luch ищет отправителей в локальной сети через Bonjour и принимает от них картинку.
        NSBonjourServices:
          - _luch._tcp
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.luch.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
