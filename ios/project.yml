name: LuchiOS
options:
  bundleIdPrefix: dev.luch
  deploymentTarget:
    iOS: "17.0"
packages:
  Luch:
    path: ..
targets:
  LuchiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: [Broadcast]
      - Assets.xcassets
    dependencies:
      - package: Luch
        product: LuchReceive
      - package: Luch
        product: LuchProto
      - target: LuchBroadcast
        embed: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Luch
        CFBundleShortVersionString: "0.1"
        NSLocalNetworkUsageDescription: Доступ к локальной сети нужен, чтобы принимать поток со стримера Luch и показывать его на этом устройстве.
        NSBonjourServices:
          - _luch._tcp
          - _luchsrc._tcp
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.luch.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic

  LuchBroadcast:
    type: app-extension
    platform: iOS
    sources: [Sources/SendCore, Sources/Broadcast]
    dependencies:
      - package: Luch
        product: LuchProto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.luch.ios.broadcast
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Broadcast/Info.plist
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
