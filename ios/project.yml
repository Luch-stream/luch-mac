name: LuchiOS
options:
  bundleIdPrefix: dev.luch
  deploymentTarget:
    iOS: "17.0"
packages:
  Luch:
    path: ..
targets:
  LuchiOS:
    type: application
    platform: iOS
    sources: [Sources, Assets.xcassets]
    dependencies:
      - package: Luch
        product: LuchReceive
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Luch
        CFBundleShortVersionString: "0.1"
        NSLocalNetworkUsageDescription: Доступ к локальной сети нужен, чтобы принимать поток со стримера Luch и показывать его на этом устройстве.
        NSBonjourServices:
          - _luch._tcp
          - _luchsrc._tcp
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.luch.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
